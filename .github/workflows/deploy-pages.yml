name: Publicar SPA no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "experiencia pratica 3/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar arquivos de produção
        shell: pwsh
        run: '& "./experiencia pratica 3/build.ps1"'

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato de produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: "experiencia pratica 3/dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
